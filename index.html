<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pixel Lyric Player - Bazzi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #000000;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'VT323', monospace;
      color: #ffffff;
    }
    #screen-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      max-width: 960px;
      height: 600px;
      background: #000000;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .panel-controls {
      margin-top: 18px;
      display: flex;
      gap: 16px;
      align-items: center;
      z-index: 10;
    }
    .retro-btn {
      background: #111111;
      border: 1px solid #333333;
      color: #eeeeee;
      padding: 10px 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .retro-btn:hover {
      background: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body>

  <div id="screen-wrapper">
    <canvas id="displayCanvas" width="960" height="600"></canvas>
  </div>

  <div class="panel-controls">
    <button id="playToggleBtn" class="retro-btn">▶ PLAY</button>
  </div>

  <!-- Berkas lokal: audio bazzi.mp3 dan video latar video.mov -->
  <audio id="audioSource" src="bazzi.mp3" preload="auto"></audio>
  <video id="videoSource" src="video.mov" loop muted playsinline style="display:none;"></video>

  <script>
    const canvas = document.getElementById('displayCanvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audioSource');
    const video = document.getElementById('videoSource');
    const playToggleBtn = document.getElementById('playToggleBtn');

    // Canvas buffer untuk sampling frame video menjadi matriks karakter
    const sampleCanvas = document.createElement('canvas');
    const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

    let audioContext = null;
    let analyser = null;
    let freqData = null;
    let isAudioEngineStarted = false;

    // Karakter ASCII untuk kepadatan piksel
    const ASCII_CHARS = " .:-=+*#%@";

    // Timeline lirik sinkron dengan vokal chorus Bazzi - Beautiful
    const lyricTimeline = [
      { start: 0.0,  end: 3.5,  text: "Beautiful\nBazzi", isIntro: true, showBg: false },
      { start: 30.5, end: 32.5, text: "Hey..", isIntro: false, showBg: false },
      { start: 32.5, end: 37.0, text: "Beautiful, beautiful,\nbeautiful angel", isIntro: false, showBg: true },
      { start: 37.0, end: 41.0, text: "Love your imperfections\nevery angle", isIntro: false, showBg: true },
      { start: 41.0, end: 46.0, text: "Tomorrow comes and goes\nbefore you know", isIntro: false, showBg: true },
      { start: 46.0, end: 51.0, text: "So I just had\nto let you know", isIntro: false, showBg: true }
    ];

    function setupAudioNodes() {
      if (isAudioEngineStarted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
        const src = audioContext.createMediaElementSource(audio);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        src.connect(analyser);
        analyser.connect(audioContext.destination);
        freqData = new Uint8Array(analyser.frequencyBinCount);
        isAudioEngineStarted = true;
      } catch (err) {
        analyser = null;
      }
    }

    function renderAsciiVideoBackground() {
      const cols = 96;
      const rows = 48;
      sampleCanvas.width = cols;
      sampleCanvas.height = rows;

      sampleCtx.drawImage(video, 0, 0, cols, rows);
      const frameData = sampleCtx.getImageData(0, 0, cols, rows).data;

      ctx.save();
      ctx.font = "12px 'Space Mono', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const charWidth = canvas.width / cols;
      const charHeight = canvas.height / rows;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const i = (y * cols + x) * 4;
          const r = frameData[i];
          const g = frameData[i + 1];
          const b = frameData[i + 2];
          const brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

          if (brightness > 0.08) {
            const charIdx = Math.floor(brightness * (ASCII_CHARS.length - 1));
            const char = ASCII_CHARS[charIdx];
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillText(char, x * charWidth + charWidth / 2, y * charHeight + charHeight / 2);
          }
        }
      }
      ctx.restore();
    }

    function drawRetroWaveform(time) {
      let spectrum = [];
      if (analyser && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        spectrum = Array.from(freqData.slice(2, 28));
      } else {
        for (let idx = 0; idx < 26; idx++) {
          const val = Math.sin(time * 6 + idx * 0.45) * 35 + 40;
          spectrum.push(Math.max(6, val));
        }
      }

      const barWidth = 7;
      const barSpacing = 4;
      const count = spectrum.length;
      const totalWidth = count * (barWidth + barSpacing);
      const startX = (canvas.width - totalWidth) / 2;
      const centerY = canvas.height / 2 + 75;

      ctx.save();
      ctx.fillStyle = "#ffffff";

      // Render batang bar audio visualizer simetris
      spectrum.forEach((magnitude, idx) => {
        const height = (magnitude / 255) * 44;
        const xPos = startX + idx * (barWidth + barSpacing);
        ctx.fillRect(xPos, centerY - height, barWidth, height * 2);
      });

      // Garis horizontal dan simbol kontrol navigasi piksel
      ctx.fillRect(startX - 50, centerY, 36, 2);
      ctx.fillRect(startX + totalWidth + 14, centerY, 36, 2);
      ctx.font = "16px 'VT323', monospace";
      ctx.textAlign = "center";
      ctx.fillText("⏮   ❙❙   ⏭", canvas.width / 2, centerY + 28);
      ctx.restore();
    }

    function drawLyricTypography(text, isIntro) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const lines = text.split("\n");

      if (isIntro) {
        ctx.font = "40px 'Press Start 2P', monospace";
        ctx.fillStyle = "#f5f5f5";
        lines.forEach((line, index) => {
          const y = canvas.height / 2 - 25 + index * 55;
          ctx.fillText(line, canvas.width / 2, y);
        });
      } else {
        ctx.font = "64px 'VT323', monospace";
        ctx.lineWidth = 14;
        ctx.strokeStyle = "#000000";
        ctx.fillStyle = "#ffffff";

        const startY = canvas.height / 2 - 35 - ((lines.length - 1) * 30);
        lines.forEach((line, index) => {
          const y = startY + index * 60;
          ctx.strokeText(line, canvas.width / 2, y);
          ctx.fillText(line, canvas.width / 2, y);
        });
      }
      ctx.restore();
    }

    function animationLoop() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const currentTime = audio.currentTime || 0;
      const activeCue = lyricTimeline.find(cue => currentTime >= cue.start && currentTime <= cue.end);

      // Gambar latar video matriks ASCII saat cue mengaktifkan showBg
      if (activeCue && activeCue.showBg && video.readyState >= 2) {
        renderAsciiVideoBackground();
      }

      // Visualizer bar ditampilkan di luar layar intro
      if (!activeCue || !activeCue.isIntro) {
        drawRetroWaveform(currentTime);
      }

      // Tampilkan teks lirik aktif
      if (activeCue) {
        drawLyricTypography(activeCue.text, activeCue.isIntro);
      }

      requestAnimationFrame(animationLoop);
    }

    playToggleBtn.addEventListener('click', () => {
      setupAudioNodes();
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }

      if (audio.paused) {
        audio.play();
        video.play();
        playToggleBtn.innerText = "⏸ PAUSE";
      } else {
        audio.pause();
        video.pause();
        playToggleBtn.innerText = "▶ PLAY";
      }
    });

    audio.addEventListener('seeked', () => {
      video.currentTime = audio.currentTime;
    });

    requestAnimationFrame(animationLoop);
  </script>
</body>
</html>
