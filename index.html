<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Lyrics Visualizer</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Area Teks / Lirik */
    #lyric-text {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Visualizer Bar ala ASCII */
    #visualizer {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 60px;
    }

    .bar {
      width: 6px;
      background-color: #fff;
      border-radius: 2px;
      height: 8px;
      transition: height 0.1s ease;
    }

    /* Kontrol player ala retro */
    #player-controls {
      font-size: 1rem;
      letter-spacing: 8px;
      color: #aaa;
    }

    /* Container Video/Gambar Pengganti */
    #media-frame {
      display: none;
      width: 480px;
      max-width: 90vw;
      border: 1px solid #333;
      filter: contrast(150%) grayscale(100%); /* Efek monokrom */
    }

    #media-frame video, #media-frame img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Tombol Mulai */
    #start-btn {
      position: absolute;
      padding: 10px 20px;
      font-size: 1.1rem;
      font-family: inherit;
      background: transparent;
      color: #fff;
      border: 1px solid #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="start-btn">Klik untuk Mulai</button>

  <div id="container">
    <div id="lyric-text">Drop Dead</div>

    <div id="media-frame">
      <video id="custom-video" src="video_tengah.mov" loop muted playsinline></video>
    </div>

    <div id="visualizer"></div>

    <div id="player-controls">|&#9664; &#9654; &#9654;|</div>
  </div>

  <script>
    const lyricElement = document.getElementById('lyric-text');
    const mediaFrame = document.getElementById('media-frame');
    const customVideo = document.getElementById('custom-video');
    const visualizer = document.getElementById('visualizer');
    const startBtn = document.getElementById('start-btn');

    // Buat batang visualizer
    const TOTAL_BARS = 28;
    const bars = [];
    for (let i = 0; i < TOTAL_BARS; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      visualizer.appendChild(bar);
      bars.push(bar);
    }

    // Animasi acak visualizer
    let visualizerActive = false;
    function animateVisualizer() {
      if (visualizerActive) {
        bars.forEach((bar, index) => {
          // Buat pola gelombang di tengah
          const distFromCenter = Math.abs(index - TOTAL_BARS / 2);
          const maxH = Math.max(8, 50 - distFromCenter * 2.5);
          const h = Math.floor(Math.random() * maxH) + 6;
          bar.style.height = `${h}px`;
        });
      }
      requestAnimationFrame(animateVisualizer);
    }
    animateVisualizer();

    // Timeline Lirik & Pergantian Tampilan (dalam milidetik)
    const timeline = [
      { time: 0, text: "Drop Dead\nOlivia Rodrigo", showVideo: false },
      { time: 2000, text: "", showVideo: false },
      { time: 3500, text: "Night", showVideo: false },
      { time: 4500, text: "Was", showVideo: false },
      { time: 5500, text: "Bed", showVideo: false },
      { time: 6500, text: "Stalked", showVideo: false },
      { time: 7500, text: "You", showVideo: false },
      { time: 8500, text: "Internet", showVideo: false },
      { time: 10500, text: "Feminine", showVideo: false },
      { time: 12000, text: "Intuition", showVideo: false },
      { time: 14000, text: "'Cause", showVideo: false },
      { time: 15000, text: "Had", showVideo: false },
      { time: 16000, text: "Vision Of Us", showVideo: false },
      { time: 17500, text: "Like", showVideo: false },
      // Detik ke-18: Tampilkan Video / Foto Pengganti
      { time: 18500, text: "All", showVideo: true },
      { time: 19500, text: "Dressed", showVideo: true },
      { time: 20500, text: "Up", showVideo: true },
      { time: 21500, text: "Looking", showVideo: true }
    ];

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      visualizerActive = true;

      timeline.forEach((item) => {
        setTimeout(() => {
          lyricElement.innerText = item.text;
          
          if (item.showVideo) {
            mediaFrame.style.display = 'block';
            customVideo.play();
          } else {
            mediaFrame.style.display = 'none';
          }
        }, item.time);
      });
    });
  </script>
</body>
</html>
